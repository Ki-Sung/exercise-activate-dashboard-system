name: garmin-sync

# GitHub Actions 의 cron 은 UTC 기준입니다. KST = UTC + 9
#   09:00 KST -> 00:00 UTC
#   12:00 KST -> 03:00 UTC
#   18:00 KST -> 09:00 UTC
#   22:00 KST -> 13:00 UTC
# ※ 스케줄은 러너 혼잡도에 따라 수 분~십수 분 지연될 수 있습니다(정시 보장 아님).
on:
  schedule:
    - cron: "0 0 * * *"   # 1차 09시
    - cron: "0 3 * * *"   # 2차 12시
    - cron: "0 9 * * *"   # 3차 18시
    - cron: "0 13 * * *"  # 4차 22시
  workflow_dispatch:
    inputs:
      days:
        description: "되돌아볼 일수 (백필 시 365)"
        required: false
        default: "14"

concurrency:
  group: garmin-sync
  cancel-in-progress: false

permissions:
  contents: read          # 최소 권한

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 재시도(최대 7회, 누적 대기 최대 ~4분)를 감안한 여유

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: batch/requirements.txt

      - name: Install dependencies
        run: pip install -r batch/requirements.txt

      - name: Resolve batch slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 0 * * *")  echo "slot=09" >> "$GITHUB_OUTPUT" ;;
            "0 3 * * *")  echo "slot=12" >> "$GITHUB_OUTPUT" ;;
            "0 9 * * *")  echo "slot=18" >> "$GITHUB_OUTPUT" ;;
            "0 13 * * *") echo "slot=22" >> "$GITHUB_OUTPUT" ;;
            *)            echo "slot=manual" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
          BATCH_SLOT: ${{ steps.slot.outputs.slot }}
        run: python -m batch.main --days ${{ github.event.inputs.days || 14 }}
